<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام إدارة المواد</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
<style>
:root{--pri:#4f46e5;--pri2:#4338ca;--grn:#2f9e6e;--amb:#e8960c;--dng:#e05252;--bg:#f3f5fb;--card:#fff;--txt:#1e2430;--mut:#7a8399;--rad:20px;--sh:0 8px 22px rgba(40,50,90,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;font-family:'Tajawal',Tahoma,sans-serif;background:var(--bg);color:var(--txt)}
button{font-family:inherit}
:focus-visible{outline:3px solid rgba(79,70,229,.4);outline-offset:2px;border-radius:8px}
header{max-width:960px;margin:14px auto 0;padding:0 12px}
.hcard{background:linear-gradient(135deg,#eef1ff,#fdf2f7);border-radius:var(--rad);box-shadow:var(--sh);padding:18px}
.hrow{display:flex;gap:14px;align-items:center}
.logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#6366f1,#2563eb);color:#fff;display:grid;place-items:center;font-size:30px;box-shadow:var(--sh)}
.hrow h1{margin:0;font-size:22px;font-weight:800;color:var(--pri2)}
.hrow p{margin:3px 0 0;color:var(--mut);font-size:13px}
.hbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.btn{border:none;border-radius:14px;padding:13px 14px;font-size:14px;font-weight:800;cursor:pointer;transition:.15s;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--pri);color:#fff}.btn.grn{background:var(--grn);color:#fff}
.btn.amb{background:var(--amb);color:#fff}.btn.ghost{background:#eef1f8;color:var(--txt)}
.btn.danger{background:#fdecec;color:var(--dng)}
main{max-width:960px;margin:0 auto;padding:14px 12px 60px}
.card{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);padding:14px;margin-bottom:14px}
.sec-h{display:flex;gap:10px;align-items:center}
.sec-h h2{font-size:16px;margin:0;flex:1}
.chev{border:none;background:#eef1f8;width:36px;height:36px;border-radius:12px;cursor:pointer;font-size:15px;transition:.2s}
.chev.open{transform:rotate(180deg)}
.file-item{display:flex;gap:10px;align-items:center;background:#f8f9ff;border:1px solid #e6e9f7;border-radius:16px;padding:10px;margin-top:10px;flex-wrap:wrap}
.file-item .fi{width:44px;height:44px;border-radius:12px;background:#e7f7ee;color:#177a4c;display:grid;place-items:center;font-size:20px}
.file-item .meta{flex:1;min-width:140px}
.file-item .meta b{font-size:14px}
.file-item .meta small{display:block;color:var(--mut)}
.statbar{background:linear-gradient(135deg,var(--pri),#2563eb);color:#fff;border-radius:16px;padding:12px 16px;font-weight:800;margin-bottom:14px;box-shadow:var(--sh)}
.gcard{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.g-h{display:flex;gap:10px;align-items:center;width:100%;border:none;background:none;padding:14px;cursor:pointer;text-align:right}
.g-h h3{margin:0;flex:1;font-size:15px;font-weight:800}
.g-ico{font-size:20px}
.chip{background:#eef1f8;color:var(--pri2);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:800;white-space:nowrap}
.chip.price{background:#e7f7ee;color:#177a4c}
.chip.ok{background:#e7f7ee;color:#177a4c;display:inline-block;margin-top:8px}
.g-body{border-top:1px solid #eef0f8;padding:12px}
.g-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.gsearch{flex:1;min-width:180px;border:2px solid #e3e7f5;border-radius:12px;padding:10px 14px;font-family:inherit;font-size:13px;outline:none;background:#fff}
.gsearch:focus{border-color:var(--pri)}
.vtoggle{display:flex;background:#eef1f8;border-radius:12px;padding:3px}
.vtoggle button{border:none;background:none;border-radius:10px;padding:8px 14px;font-size:12px;font-weight:800;cursor:pointer;color:var(--mut)}
.vtoggle button.on{background:var(--pri);color:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#f4f6fd;padding:9px 10px;text-align:right;font-size:12px;color:var(--mut)}
.tbl td{padding:9px 10px;border-top:1px solid #f0f2fa}
.tbl tr{cursor:pointer}
.tbl tr:hover,.tbl tr.hl{background:#eef2ff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:1px solid #e8ebf7;background:#fbfcff;border-radius:16px;padding:12px;cursor:pointer;text-align:right;display:flex;flex-direction:column;gap:8px;transition:.15s}
.tile:hover,.tile.hl{border-color:var(--pri);background:#eef2ff;transform:translateY(-2px)}
.tile b{font-size:13px;line-height:1.5;min-height:38px}
.trow{display:flex;gap:6px;flex-wrap:wrap}
.trow i{font-style:normal;font-size:11px;border-radius:12px;padding:2px 8px}
.trow .q{background:#eef1f8;color:var(--pri2)}.trow .p{background:#fdf3e3;color:#a26a08}
.empty{text-align:center;color:var(--mut);padding:26px 0;font-size:14px}
.overlay{position:fixed;inset:0;background:rgba(20,25,50,.45);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}
.modal{background:#fff;border-radius:22px;width:min(600px,96vw);max-height:92vh;overflow:auto;padding:16px;animation:up .25s}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.m-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.m-head h2{margin:0;font-size:17px}
.x{border:none;background:#f1f3fa;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:14px}
.vchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.vdetails{background:#f8f9ff;border:1px solid #e6e9f7;border-radius:16px;padding:12px;font-size:13px}
.vdetails .ln{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed #e6e9f7}
.vdetails .ln:last-child{border:none}
.vdetails .ln b{color:var(--mut);min-width:95px;font-weight:700}
.note{background:#fdf7e7;border:1px solid #f0e2b8;border-radius:12px;padding:10px;margin-top:10px;white-space:pre-wrap}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.row .btn{flex:1}
label{display:block;font-size:13px;font-weight:800;margin:12px 0 6px}
textarea{width:100%;border:2px solid #e3e7f5;border-radius:12px;padding:10px;font-family:inherit;font-size:13px;min-height:70px;resize:vertical;outline:none}
textarea:focus{border-color:var(--pri)}
#maintSec{background:#f6f8ff;border:1px solid #e3e7f5;border-radius:16px;padding:12px;margin-top:12px}
.cam-video{width:100%;max-height:320px;object-fit:cover;border-radius:16px;background:#000;margin-top:10px}
.bar{height:8px;background:#e5e9f5;border-radius:8px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
.prog-txt{text-align:center;font-size:12px;color:var(--mut);margin:6px 0 0}
#imgPrev{width:100%;border-radius:14px;margin-top:8px}
.best{border:2px solid var(--grn);border-radius:16px;padding:12px;margin-bottom:12px;cursor:pointer}
.best.mid{border-color:var(--amb)}.best.low{border-color:var(--dng)}
.best .imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.best .imgs img{width:100%;height:130px;object-fit:cover;border-radius:12px}
.best .imgs span{display:block;text-align:center;font-size:11px;color:var(--mut)}
.pct{display:inline-block;background:var(--grn);color:#fff;border-radius:20px;padding:3px 14px;font-weight:800}
.pct.mid{background:var(--amb)}.pct.low{background:var(--dng)}
.cand{display:flex;align-items:center;gap:10px;background:#f7f8ff;border-radius:12px;padding:8px 10px;margin-bottom:8px;cursor:pointer}
.cand .nm{flex:1;font-size:13px;font-weight:700}
.cand .pv{font-size:12px;font-weight:800;color:var(--pri2)}
footer{max-width:960px;margin:0 auto;padding:0 12px 26px;color:var(--mut);font-size:12px;text-align:center}
#toast{position:fixed;bottom:18px;right:50%;transform:translateX(50%);background:#22333b;color:#fff;border-radius:12px;padding:11px 20px;font-size:13px;z-index:99;max-width:90vw;text-align:center}
#toast.err{background:var(--dng)}
</style>
</head>
<body>
<header>
  <div class="hcard">
    <div class="hrow">
      <div class="logo">📦</div>
      <div><h1>نظام إدارة المواد</h1><p>المبرمج: أحمد برزان</p></div>
    </div>
    <div class="hbtns">
      <button class="btn pri" id="btnRepo">🔄 تحديث من المستودع</button>
      <button class="btn grn" id="btnSave">💾 حفظ الملف</button>
      <button class="btn ghost" id="btnUpload">📂 رفع ملف</button>
      <button class="btn amb" id="btnScan">📷 التعرف على المادة</button>
    </div>
  </div>
</header>
<input type="file" id="filePick" accept=".xlsx,.xls" hidden>

<main>
  <section class="card" id="filesSec">
    <div class="sec-h"><button class="chev open" id="filesChev">⌄</button><h2>🗂 الملفات المحفوظة محلياً</h2></div>
    <div id="filesList"></div>
  </section>

  <div class="statbar" id="statbar" hidden></div>
  <section id="groups"></section>
  <p class="empty" id="emptyMsg">اضغط «تحديث من المستودع 🔄» لجلب ملف المواد من GitHub، أو «رفع ملف 📂».</p>
</main>
<footer>اختصارات الكيبورد: Esc إغلاق • Enter التقاط/فتح • ↑↓ التنقل في نتائج البحث داخل البطاقة</footer>

<!-- تفاصيل مادة -->
<div class="overlay" id="viewModal" hidden>
  <div class="modal">
    <div class="m-head"><h2 id="vName"></h2><button class="x" data-close>✕</button></div>
    <div class="vchips"><span class="chip" id="vGroup"></span><span class="chip price" id="vPrice"></span><span class="chip" id="vQty"></span></div>
    <div class="vdetails" id="vDetails"></div>
    <div class="row"><button class="btn ghost" id="btnMaint">⚙ إعدادات / صيانة</button></div>
    <div id="maintSec" hidden>
      <label>إضافة تفاصيل تظهر مع المادة</label>
      <textarea id="noteInput" placeholderاكتب أي ملاحظات إضافية…"></textarea>
      <div class="row"><button class="btn pri" id="saveNote">💾 حفظ التفاصيل</button></div>
      <label>صورة المادة — تُعالج بثلاثة محركات (شبكة عصبية + ألوان + OCR)</label>
      <img id="imgPrev" hidden>
      <div class="row">
        <button class="btn amb" id="camAttach">📷 كاميرا</button>
        <button class="btn ghost" id="fileAttach">🖼 رفع صورة</button>
        <button class="btn danger" id="delImg" hidden>🗑 حذف الصورة</button>
      </div>
      <input type="file" id="fileAttachInput" accept="image/*" hidden>
      <video id="videoAttach" class="cam-video" hidden playsinline muted autoplay></video>
      <div class="row" id="camBar" hidden><button class="btn ghost" id="cancelCam">رجوع</button><button class="btn danger" id="shotAttach">⬤ التقاط</button></div>
      <div id="procProg" hidden><div class="bar"><i id="procBar"></i></div><p class="prog-txt" id="procTxt"></p></div>
    </div>
  </div>
</div>

<!-- التعرف على المادة -->
<div class="overlay" id="scanModal" hidden>
  <div class="modal">
    <div class="m-head"><h2>📷 التعرف على المادة</h2><button class="x" data-close>✕</button></div>
    <div id="scanCam">
      <video id="videoScan" class="cam-video" playsinline muted autoplay></video>
      <div class="row"><button class="btn ghost" id="fileScanBtn">🖼 صورة</button><button class="btn danger" id="shotScan">⬤ التقاط (Enter)</button></div>
      <input type="file" id="fileScan" accept="image/*" hidden>
    </div>
    <div id="scanProg" hidden><div class="bar"><i id="scanBar"></i></div><p class="prog-txt" id="scanProgTxt"></p></div>
    <div id="scanRes" hidden>
      <div id="bestCard"></div>
      <h3 style="font-size:14px;margin:8px 0">بقية المرشحات:</h3>
      <div id="candList"></div>
      <div class="row"><button class="btn pri" id="rescan">🔁 تصوير مادة أخرى</button></div>
    </div>
  </div>
</div>

<div id="toast" hidden></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const NO_GROUP='مواد بدون بطاقة';
/* ⚙️ إذا غيّرت اسم ملف الإكسل داخل المستودع عدّله هنا */
const REPO_FILE='جميع المواد.xlsx';
const REPO_URLS=['main','master'].map(b=>'https://raw.githubusercontent.com/AHMEDBRZAN/Baht/'+b+'/'+encodeURIComponent(REPO_FILE))
 .concat(['materials.xlsx','data.xlsx'].map(f=>'https://raw.githubusercontent.com/AHMEDBRZAN/Baht/main/'+f));

let ROWS=[],ROWMAP={},GROUPS=[],IMAGES={},EXTRAS={},VIEWS={},EXP={},FILES=[];
let currentId=null,model=null,attachStream=null,scanStream=null;

/* ---------- أدوات ---------- */
function toast(m,t){const e=$('toast');e.textContent=m;e.className=t||'';e.hidden=false;clearTimeout(e._h);e._h=setTimeout(()=>e.hidden=true,3500);}
function esc(s){return (s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function short(s,n){n=n||42;s=s??'';return s.length>n?s.slice(0,n)+'…':s;}
function parseNum(v){if(typeof v==='number')return isFinite(v)?v:0;if(v==null)return 0;let s=String(v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,،\s]/g,'');const n=parseFloat(s);return isFinite(n)?n:0;}
function fm(n){n=parseNum(n);return n?n.toLocaleString('en-US',{maximumFractionDigits:2}):'0';}
function norm(s){return (s||'').toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[^\p{L}\p{N}]+/gu,' ').trim();}
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m||!n)return m||n;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function scaleDataUrl(url,maxW,q){return new Promise(res=>{const i=new Image();i.onload=()=>{const s=Math.min(1,maxW/i.width);const c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q||.85));};i.src=url;});}
function imgEl(url){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});}

/* ---------- قاعدة البيانات ---------- */
let dbP=null;
function db(){if(!dbP)dbP=new Promise((res,rej)=>{const r=indexedDB.open('matSysDB',1);r.onupgradeneeded=()=>{const d=r.result;['files','extras','images'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s);});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});return dbP;}
async function dbGetAll(s){const d=await db();return new Promise(res=>{const q=d.transaction(s).objectStore(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([]);});}
async function dbPut(s,k,v){const d=await db();return new Promise(res=>{const t=d.transaction(s,'readwrite');t.objectStore(s).put(v,k);t.oncomplete=res;});}
async function dbDel(s,k){const d=await db();return new Promise(res=>{const t=d.transaction(s,'readwrite');t.objectStore(s).delete(k);t.oncomplete=res;});}

/* ---------- قراءة الإكسل ---------- */
function parseWorkbook(buf){
  try{
    const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const arr=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    let hi=-1,col={};
    for(let i=0;i<Math.min(arr.length,30);i++){const cells=arr[i].map(c=>String(c).trim());if(cells.includes('اسم المادة')){hi=i;cells.forEach((c,j)=>col[c]=j);break;}}
    if(hi<0)return null;
    const g=k=>col[k]??-1, rows=[];
    for(let i=hi+1;i<arr.length;i++){const r=arr[i];const name=String(r[g('اسم المادة')]??'').trim();
      if(!name||name==='اسم المادة')continue;
      const code=String(r[g('الرمز')]??'').trim();
      rows.push({id:code?('c'+code):('r'+i),seq:String(r[g('#')]??'').trim(),code,name,
        unit:String(r[g('الوحدة')]??'').trim(),sell:parseNum(r[g('سعر المبيع')]),
        group:String(r[g('بطاقة مجموعة')]??'').trim(),latin:String(r[g('الاسم اللاتيني')]??'').trim(),
        qty:parseNum(r[g('الكمية')]),buy:parseNum(r[g('سعر الشراء')]),
        barcode:String(r[g('الباركود')]??'').replace(/;/g,'').trim()});
    }
    return rows.length?rows:null;
  }catch(e){console.error(e);return null;}
}

/* ---------- تحميل البيانات ---------- */
function loadDataset(rows,meta){
  ROWS=rows;ROWMAP={};ROWS.forEach(r=>{r.n=norm(r.name);r.ln=norm(r.latin);ROWMAP[r.id]=r;});
  const m=new Map();
  ROWS.forEach(r=>{const g=r.group||NO_GROUP;if(!m.has(g))m.set(g,[]);m.get(g).push(r);});
  GROUPS=[...m.entries()].map(([name,rws])=>({name,rows:rws,vis:rws,hi:-1}))
    .sort((a,b)=>((a.name===NO_GROUP)-(b.name===NO_GROUP))||a.name.localeCompare(b.name,'ar'));
  GROUPS.forEach(g=>{if(!(g.name in EXP))EXP[g.name]=true;if(!VIEWS[g.name])VIEWS[g.name]='table';});
  $('statbar').hidden=false;
  $('statbar').textContent='📊 '+ROWS.length+' مادة موزعة على '+GROUPS.length+' بطاقة مجموعة'+(meta?' — المصدر: '+meta.name:'');
  $('emptyMsg').hidden=true;
  renderGroups();
}
function groupEl(name){return [...document.querySelectorAll('.gcard')].find(c=>c.dataset.g===name);}

function renderGroups(){
  $('groups').innerHTML=GROUPS.map(g=>{
    const open=EXP[g.name],v=VIEWS[g.name];
    return `<div class="gcard" data-g="${esc(g.name)}">
      <button class="g-h" data-toggle="${esc(g.name)}" aria-expanded="${open}">
        <span class="chev ${open?'open':''}">⌄</span><span class="g-ico">📁</span>
        <h3>${esc(g.name)}</h3><span class="chip">${g.rows.length} مادة</span>
      </button>
      <div class="g-body" ${open?'':'hidden'}>
        <div class="g-tools">
          <input class="gsearch" data-search="${esc(g.name)}" placeholder="🔍 بحث ذكي في «${esc(g.name)}»…">
          <div class="vtoggle">
            <button data-view="table" class="${v==='table'?'on':''}">📋 جدول</button>
            <button data-view="grid" class="${v==='grid'?'on':''}">🧱 شبكة</button>
          </div>
        </div>
        <div class="g-content"></div>
      </div>
    </div>`;
  }).join('');
  GROUPS.forEach(g=>{if(EXP[g.name])renderGroupContent(g.name);});
}
function renderGroupContent(name){
  const g=GROUPS.find(x=>x.name===name),card=groupEl(name);if(!g||!card)return;
  const el=card.querySelector('.g-content'),v=VIEWS[name],list=g.vis;
  if(!list.length){el.innerHTML='<p class="empty">لا توجد نتائج مطابقة</p>';return;}
  if(v==='table'){
    el.innerHTML='<table class="tbl"><thead><tr><th>ت</th><th>اسم المادة</th><th>الكمية</th><th>سعر المبيع</th></tr></thead><tbody>'
      +list.map(r=>`<tr tabindex="0" data-id="${r.id}"><td>${esc(r.seq)}</td><td>${esc(short(r.name))}</td><td>${fm(r.qty)}</td><td>${fm(r.sell)}</td></tr>`).join('')
      +'</tbody></table>';
  }else{
    el.innerHTML='<div class="tiles">'+list.map(r=>`<button class="tile" data-id="${r.id}"><b>${esc(short(r.name,70))}</b><span class="trow"><i class="q">📦 ${fm(r.qty)}</i><i class="p">💰 ${fm(r.sell)}</i></span></button>`).join('')+'</div>';
  }
  g.hi=-1;
}

/* ---------- البحث الذكي داخل البطاقة ---------- */
function searchScore(q,r){const nq=norm(q);if(!nq)return 0;let s=0;
  if(r.n===nq)s+=120;else if(r.n.includes(nq))s+=100;else if(r.ln.includes(nq))s+=70;
  for(const t of nq.split(' ')){if(t.length<2)continue;
    if(r.n.includes(t))s+=30;else if(r.ln.includes(t))s+=20;
    else if(String(r.code).includes(t)||String(r.barcode).includes(t))s+=40;
    else for(const w of r.n.split(' '))if(w.length>=3&&lev(w,t)<=1){s+=18;break;}}
  return s;}

/* ---------- الملفات المحلية ---------- */
function renderFiles(){
  $('filesList').innerHTML=FILES.length?FILES.map(f=>`<div class="file-item">
    <div class="fi">📗</div><div class="meta"><b>${esc(f.name)}</b><small>${new Date(f.ts).toLocaleString('ar-IQ')} • ${f.rows.length} مادة</small></div>
    <button class="btn pri" data-openfile="${f.id}">📂 فتح</button>
    <button class="btn danger" data-delfile="${f.id}">🗑</button></div>`).join('')
   :'<p class="empty" style="padding:8px 0">لا توجد نسخ محلية بعد — اضغط «حفظ الملف 💾» بعد الجلب.</p>';
}
$('btnSave').onclick=async()=>{if(!ROWS.length)return toast('لا يوجد ملف محمّل للحفظ','err');
  const id='f'+Date.now();FILES.unshift({id,name:REPO_FILE,ts:Date.now(),rows:ROWS});await dbPut('files',id,{id,name:REPO_FILE,ts:Date.now(),rows:ROWS});renderFiles();toast('تم حفظ النسخة محلياً 💾');};

/* ---------- الجلب من المستودع / رفع ---------- */
$('btnRepo').onclick=async()=>{toast('جارٍ الجلب من المستودع…');
  for(const u of REPO_URLS){try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)continue;
    const buf=await r.arrayBuffer();if(buf.byteLength<1000)continue;
    const rows=parseWorkbook(buf);if(rows){loadDataset(rows,{name:REPO_FILE});toast('تم الجلب من المستودع ✔ '+rows.length+' مادة');return;}}catch(e){}}
  toast('تعذر الجلب — تأكد أن الملف مرفوع باسم «'+REPO_FILE+'» في جذر المستودع، أو استخدم «رفع ملف»','err');};
$('btnUpload').onclick=()=>$('filePick').click();
$('filePick').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const rows=parseWorkbook(r.result);rows?(loadDataset(rows,{name:f.name}),toast('تم تحميل «'+f.name+'» ✔')):toast('ملف غير مدعوم','err');};
  r.readAsArrayBuffer(f);};

/* ---------- تفاعل البطاقات ---------- */
$('groups').addEventListener('click',e=>{
  const t=e.target;
  const h=t.closest('[data-toggle]');
  if(h){const n=h.dataset.toggle;EXP[n]=!EXP[n];const card=groupEl(n);
    card.querySelector('.g-body').hidden=!EXP[n];h.querySelector('.chev').classList.toggle('open',EXP[n]);
    if(EXP[n])renderGroupContent(n);return;}
  const v=t.closest('[data-view]');
  if(v){const card=v.closest('.gcard'),n=card.dataset.g;VIEWS[n]=v.dataset.view;
    card.querySelectorAll('.vtoggle button').forEach(b=>b.classList.toggle('on',b===v));renderGroupContent(n);return;}
  const item=t.closest('[data-id]');if(item)openView(item.dataset.id);
});
$('groups').addEventListener('input',e=>{
  const s=e.target.closest('[data-search]');if(!s)return;
  const n=s.dataset.search,g=GROUPS.find(x=>x.name===n),q=s.value.trim();
  g.vis=q?g.rows.map(r=>({r,s:searchScore(q,r)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.r):g.rows;
  renderGroupContent(n);
});
$('groups').addEventListener('keydown',e=>{
  const s=e.target.closest('[data-search]');
  if(s){const n=s.dataset.search,g=GROUPS.find(x=>x.name===n),card=groupEl(n),items=card.querySelectorAll('[data-id]');
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!items.length)return;
      g.hi=Math.max(0,Math.min(items.length-1,g.hi+(e.key==='ArrowDown'?1:-1)));
      items.forEach((el,i)=>el.classList.toggle('hl',i===g.hi));items[g.hi].scrollIntoView({block:'nearest'});}
    else if(e.key==='Enter'&&g.hi>=0&&items[g.hi]){openView(items[g.hi].dataset.id);}
    return;}
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.id)openView(e.target.dataset.id);
});

/* ---------- تفاصيل المادة ---------- */
function openView(id){const r=ROWMAP[id];if(!r)return;currentId=id;
  $('vName').textContent=r.name;$('vGroup').textContent='📁 '+(r.group||NO_GROUP);
  $('vPrice').textContent='💰 '+fm(r.sell)+' د.ع';$('vQty').textContent='📦 الكمية: '+fm(r.qty);
  const lines=[['الرمز',r.code],['الوحدة',r.unit],['سعر الشراء',fm(r.buy)],['الباركود',r.barcode],['الاسم اللاتيني',r.latin]].filter(x=>x[1]);
  let html=lines.map(l=>`<div class="ln"><b>${l[0]}:</b><span>${esc(l[1])}</span></div>`).join('');
  const note=EXTRAS[id]&&EXTRAS[id].note;if(note)html+=`<div class="note">📝 ${esc(note)}</div>`;
  if(IMAGES[id])html+=`<span class="chip ok">🖼 صورة مُعالَجة جاهزة للتعرف</span>`;
  $('vDetails').innerHTML=html;
  $('maintSec').hidden=true;$('viewModal').hidden=false;
  $('noteInput').value=note||'';
  const im=IMAGES[id];$('imgPrev').hidden=!im;if(im)$('imgPrev').src=im.thumb;$('delImg').hidden=!im;
}
$('btnMaint').onclick=()=>{$('maintSec').hidden=!$('maintSec').hidden;};
$('saveNote').onclick=async()=>{const n=$('noteInput').value.trim();EXTRAS[currentId]={id:currentId,note:n};
  await dbPut('extras',currentId,EXTRAS[currentId]);toast('تم حفظ التفاصيل ✔');openView(currentId);$('maintSec').hidden=false;};

/* ---------- الكاميرا ---------- */
async function startCam(video){stopCams();try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
  (video===('videoAttach')?($('videoAttach')):($('videoScan'))).srcObject=st;
  if(video==='videoAttach')attachStream=st;else scanStream=st;
  await (video==='videoAttach'?$('videoAttach'):$('videoScan')).play();return true;}
  catch(e){toast('تعذر فتح الكاميرا: '+e.message,'err');return false;}}
function stopCams(){[attachStream,scanStream].forEach(s=>{if(s)s.getTracks().forEach(t=>t.stop());});attachStream=scanStream=null;}
function capture(videoId){const v=$(videoId);if(!v.videoWidth)return null;
  const s=Math.min(1,640/v.videoWidth);const c=document.createElement('canvas');
  c.width=Math.round(v.videoWidth*s);c.height=Math.round(v.videoHeight*s);
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.9);}

/* إرفاق صورة ومعالجتها بالمحركات */
$('camAttach').onclick=async()=>{$('videoAttach').hidden=false;$('camBar').hidden=false;await startCam('videoAttach');};
$('cancelCam').onclick=()=>{$('videoAttach').hidden=true;$('camBar').hidden=true;stopCams();};
$('shotAttach').onclick=()=>{const u=capture('videoAttach');if(!u)return toast('انتظر جاهزية الكاميرا','err');
  $('videoAttach').hidden=true;$('camBar').hidden=true;stopCams();processAttach(u);};
$('fileAttach').onclick=()=>$('fileAttachInput').click();
$('fileAttachInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>processAttach(r.result);r.readAsDataURL(f);};
$('delImg').onclick=async()=>{delete IMAGES[currentId];await dbDel('images',currentId);$('imgPrev').hidden=true;$('delImg').hidden=true;toast('حُذفت الصورة 🗑');};

async function getEmbed(url){if(!model){$('procTxt')&&($('procTxt').textContent='تحميل نموذج الذكاء (أول مرة)…');model=await mobilenet.load({version:2,alpha:0.75});}
  const img=await imgEl(url);const t=model.infer(img,true);const a=Array.from(await t.data());t.dispose();return a;}
function histFrom(url){return new Promise(res=>{const i=new Image();i.onload=()=>{const S=64,c=document.createElement('canvas');c.width=S;c.height=S;const x=c.getContext('2d');x.drawImage(i,0,0,S,S);const d=x.getImageData(0,0,S,S).data,h=new Array(64).fill(0);for(let p=0;p<d.length;p+=4){h[Math.min(3,d[p]>>6)*16+Math.min(3,d[p+1]>>6)*4+Math.min(3,d[p+2]>>6)]++;}res(h.map(v=>v/(S*S)));};i.src=url;});}
function ocrText(url,onP){return new Promise(async res=>{try{if(!window.Tesseract)return res('');
  const r=await Tesseract.recognize(url,'ara+eng',{logger:m=>{if(onP&&m.status==='recognizing text')onP(Math.round(m.progress*100));}});res(r.data.text||'');}catch(e){res('');}});}
function setProc(t,p){$('procProg').hidden=false;$('procTxt').textContent=t;$('procBar').style.width=p+'%';}

async function processAttach(url){
  try{
    setProc('⚙ المحرك 1/3: الشبكة العصبية…',15);const emb=await getEmbed(url);
    setProc('⚙ المحرك 2/3: بصمة الألوان…',45);const hist=await histFrom(url);
    setProc('⚙ المحرك 3/3: قراءة النص OCR…',65);const ocr=await ocrText(await scaleDataUrl(url,800,.85),p=>setProc('⚙ المحرك 3/3: OCR '+p+'%',65+Math.round(p*.3)));
    const thumb=await scaleDataUrl(url,300,.8);
    IMAGES[currentId]={id:currentId,thumb,emb:emb.map(v=>+v.toFixed(4)),hist,ocr,ts:Date.now()};
    await dbPut('images',currentId,IMAGES[currentId]);
    $('imgPrev').src=thumb;$('imgPrev').hidden=false;$('delImg').hidden=false;
    setProc('✔ اكتملت المعالجة بالمحركات الثلاثة',100);setTimeout(()=>{$('procProg').hidden=true;},1500);
    toast('تمت معالجة الصورة — ستظهر المادة مباشرة عند التطابق ✔');openView(currentId);$('maintSec').hidden=false;
  }catch(e){console.error(e);$('procProg').hidden=true;toast('خطأ بالمعالجة: '+e.message,'err');}
}

/* ---------- التعرف على المادة ---------- */
function cosine(a,b){let d=0,na=0,nb=0;for(let i=0;i<Math.min(a.length,b.length);i++){d+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i];}return d/(Math.sqrt(na)*Math.sqrt(nb)+1e-9);}
function histInter(a,b){let s=0;for(let i=0;i<a.length;i++)s+=Math.min(a[i],b[i]);return s;}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function ocrScoreFor(text,id){const hay=norm(text);if(!hay)return 0;const r=ROWMAP[id];if(!r)return 0;
  const digits=(text.match(/\d{5,}/g)||[]);if(r.barcode&&digits.includes(r.barcode))return 1;
  const toks=(r.n+' '+r.ln+' '+norm(EXTRAS[id]&&EXTRAS[id].note)+' '+r.code).split(' ').filter(w=>w.length>=3);
  if(!toks.length)return 0;let hit=0;
  for(const w of toks){if(hay.includes(w)){hit++;continue;}for(const p of hay.split(' '))if(p.length>=3&&lev(p,w)<=1){hit++;break;}}
  return Math.min(1,hit/toks.length);}

$('btnScan').onclick=async()=>{const has=Object.keys(IMAGES).length;if(!has)return toast('أرفق صورة لمادة واحدة على الأقل أولاً (من تفاصيل المادة ⚙)','err');
  $('scanModal').hidden=false;$('scanCam').hidden=false;$('scanRes').hidden=true;$('scanProg').hidden=true;await startCam('videoScan');};
$('shotScan').onclick=()=>{const u=capture('videoScan');if(!u)return toast('انتظر جاهزية الكاميرا','err');stopCams();recognize(u);};
$('fileScanBtn').onclick=()=>$('fileScan').click();
$('fileScan').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{stopCams();recognize(r.result);};r.readAsDataURL(f);};
$('rescan').onclick=async()=>{$('scanRes').hidden=true;$('scanCam').hidden=false;await startCam('videoScan');};
function setScan(t,p){$('scanProgTxt').textContent=t;$('scanBar').style.width=p+'%';}

async function recognize(url){
  $('scanCam').hidden=true;$('scanRes').hidden=true;$('scanProg').hidden=false;setScan('المحرك 1: الشبكة العصبية…',15);
  try{
    const emb=await getEmbed(url);setScan('المحرك 2: بصمة الألوان…',40);
    const hist=await histFrom(url);
    let res=Object.values(IMAGES).map(im=>{
      const v=clamp((cosine(emb,im.emb)-0.45)/0.55,0,1),h=clamp((histInter(hist,im.hist)-0.45)/0.55,0,1);
      return {im,v,h,s:.7*v+.3*h};}).sort((a,b)=>b.s-a.s);
    if(!res.length||res[0].s<0.85){setScan('المحرك 3: قراءة النص OCR…',60);
      const txt=await ocrText(await scaleDataUrl(url,800,.85),p=>setScan('OCR '+p+'%',60+Math.round(p*.3)));
      if(txt)res=res.map(r=>({...r,s:.55*r.v+.2*r.h+.25*ocrScoreFor(txt,r.im.id)})).sort((a,b)=>b.s-a.s);}
    setScan('تجهيز النتائج…',95);renderResults(url,res);
  }catch(e){console.error(e);toast('تعذر التحليل: '+e.message,'err');$('scanCam').hidden=false;}
  $('scanProg').hidden=true;
}
function renderResults(url,res){
  const best=res[0],bc=$('bestCard');
  if(best){const pct=Math.round(best.s*100),cls=pct>=60?'':(pct>=35?'mid':'low'),r=ROWMAP[best.im.id];
    bc.innerHTML=`<div class="best ${cls}" data-openbest="${best.im.id}">
      <div class="imgs"><div><img src="${url}"><span>الصورة الملتقطة</span></div><div><img src="${best.im.thumb}"><span>الصورة المخزّنة</span></div></div>
      <span class="pct ${cls}">تطابق ${pct}%</span>
      <h3 style="margin:8px 0 4px;font-size:15px">${esc(r?r.name:'')}</h3>
      <p style="margin:0;font-size:12px;color:var(--mut)">${esc(r?(r.group||NO_GROUP)+' • سعر المبيع: '+fm(r.sell):'')}</p></div>`;
    if(pct>=60){setTimeout(()=>{toast('تعرّف مباشر ✔');openView(best.im.id);},350);}
  }else bc.innerHTML='<p class="empty">لا صور معالجة.</p>';
  $('candList').innerHTML=res.slice(1,6).map(x=>{const r=ROWMAP[x.im.id];return `<div class="cand" data-openbest="${x.im.id}"><span class="nm">${esc(r?r.name:'')}</span><span class="pv">${Math.round(x.s*100)}%</span></div>`;}).join('');
  $('scanRes').hidden=false;
}
$('scanRes').addEventListener('click',e=>{const c=e.target.closest('[data-openbest]');if(c){$('scanModal').hidden=true;stopCams();openView(c.dataset.openbest);}});

/* ---------- عام ---------- */
function closeModals(){document.querySelectorAll('.overlay').forEach(o=>o.hidden=true);stopCams();
  $('videoAttach').hidden=true;$('camBar').hidden=true;}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModals);
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)closeModals();}));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModals();return;}
  if(e.key==='Enter'&&!e.target.closest('input,textarea,button')){
    if(!$('scanModal').hidden&&!$('scanCam').hidden)$('shotScan').click();
    else if(!$('viewModal').hidden&&!$('videoAttach').hidden)$('shotAttach').click();
  }
});
$('filesChev').onclick=()=>{$('filesList').hidden=!$('filesList').hidden;$('filesChev').classList.toggle('open',!$('filesList').hidden);};
$('filesList').addEventListener('click',async e=>{
  const o=e.target.closest('[data-openfile]');if(o){const f=FILES.find(x=>x.id===o.dataset.openfile);if(f){loadDataset(f.rows,{name:f.name});toast('تم فتح «'+f.name+'» ✔');}return;}
  const d=e.target.closest('[data-delfile]');if(d){await dbDel('files',d.dataset.delfile);FILES=FILES.filter(x=>x.id!==d.dataset.delfile);renderFiles();toast('حُذف الملف 🗑');}
});

/* ---------- بدء ---------- */
(async()=>{
  try{
    FILES=(await dbGetAll('files')).sort((a,b)=>b.ts-a.ts);renderFiles();
    (await dbGetAll('extras')).forEach(x=>EXTRAS[x.id]=x);
    (await dbGetAll('images')).forEach(x=>IMAGES[x.id]=x);
    if(FILES.length){loadDataset(FILES[0].rows,{name:FILES[0].name});toast('تم تحميل النسخة المحلية ✔');}
  }catch(e){console.error(e);}
})();
</script>
